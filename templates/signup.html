{% extends "base.html" %}

{% block title %}
Sign Up | ShopNow
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-9 col-lg-6">

            <div class="card border-0 shadow rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            Create Account
                        </h2>

                        <p class="text-muted">
                            Join ShopNow as a customer or seller
                        </p>

                    </div>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label fw-semibold"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control"
                                placeholder="Choose a username"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label fw-semibold"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="role"
                                class="form-label fw-semibold"
                            >
                                Account Type
                            </label>

                            <select
                                name="role"
                                id="role"
                                class="form-select"
                                required
                            >

                                <option value="Customer">
                                    Customer
                                </option>

                                <option value="Seller">
                                    Seller
                                </option>

                            </select>

                            <small class="text-muted">

                                Seller accounts require admin approval.

                            </small>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="password"
                                    class="form-label fw-semibold"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Minimum 6 characters"
                                    minlength="6"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-4">

                                <label
                                    for="confirm_password"
                                    class="form-label fw-semibold"
                                >
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    name="confirm_password"
                                    id="confirm_password"
                                    class="form-control"
                                    placeholder="Enter password again"
                                    minlength="6"
                                    required
                                >

                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                        >
                            Create Account
                        </button>

                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">

                        Already have an account?

                        <a
                            href="{% url 'login' %}"
                            class="text-decoration-none fw-semibold"
                        >
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
