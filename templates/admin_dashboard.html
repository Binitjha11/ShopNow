{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">Admin Dashboard</h1>

<div class="row">

    <div class="col-md-4">
        <div class="card shadow p-4 text-center">
            <h2>{{ total_users }}</h2>
            <h5>Total Users</h5>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow p-4 text-center">
            <h2>{{ total_products }}</h2>
            <h5>Total Products</h5>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow p-4 text-center">
            <h2>{{ total_orders }}</h2>
            <h5>Total Orders</h5>
        </div>
    </div>

    <div class="mt-4">
    <a href="/pending-products/" class="btn btn-success">
        Approve Products
    </a>

    <a href="/pending-sellers/" class="btn btn-info me-2">
        Approve Sellers
    </a>
    
    <a href="/manage-orders/" class="btn btn-warning mt-3">
        Manage Orders
    </a>
    

</div>

</div>

{% endblock %}
